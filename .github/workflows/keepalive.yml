name: 仓库保活（防止60天无活动被停用）

on:
  # 每周日 UTC 03:00（北京时间 11:00）推送一次时间戳，活动间隔远小于 60 天
  schedule:
    - cron: '0 3 * * 0'
  # 支持手动触发测试
  workflow_dispatch:

# 推送提交需要写入仓库内容的权限
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          {
            echo "# 保活标记（由 keepalive 工作流自动更新，勿手动编辑）"
            echo "last-active: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "trigger: ${{ github.event_name }}"
          } > .github/keepalive

      - name: 提交并推送时间戳
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          if git diff --cached --quiet; then
            echo "没有内容变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 保活更新时间戳 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
